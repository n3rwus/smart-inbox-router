name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Code Quality
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --all-packages --frozen

      - name: Check formatting
        run: uv run ruff format --check .

      - name: Run linter
        run: uv run ruff check --output-format=github .

      - name: Run type checking
        run: uv run mypy

      - name: Check architecture boundaries
        run: uv run lint-imports

  test:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --all-packages --frozen

      - name: Run tests
        env:
          LLM__PROVIDER: test
        run: uv run pytest --cov

  migrations:
    name: Database Migrations
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: [router, notifier]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --all-packages --frozen

      - name: Apply migrations and check model consistency
        working-directory: services/${{ matrix.service }}
        env:
          DATABASE_URL: sqlite+aiosqlite:///./ci.db
        run: |
          uv run alembic upgrade head
          uv run alembic check

  security:
    name: Security Scans
    runs-on: ubuntu-latest
    needs: [lint]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Scan Git history for secrets
        run: make sec-secrets

      - name: Scan dependencies and configuration
        run: make sec-deps sec-config

      - name: Scan Docker images
        run: make sec-images

  docker:
    name: Docker Build
    runs-on: ubuntu-latest
    needs: [lint, test]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Validate Docker Compose configuration
        run: docker compose config --quiet

      - name: Build Docker images
        run: docker compose build router-api notifier

name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv sync --all-packages --frozen
      - name: Format
        run: uv run ruff format --check .
      - name: Lint
        run: uv run ruff check --output-format=github .
      - name: Type checking
        run: uv run mypy
      - name: Architecture boundaries
        run: uv run lint-imports

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv sync --all-packages --frozen
      - name: Tests (without Ollama or Docker)
        env:
          LLM__PROVIDER: test
        run: uv run pytest --cov

  migrations:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: [router, notifier]
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv sync --all-packages --frozen
      - name: Fresh migrations and model consistency check
        working-directory: services/${{ matrix.service }}
        env:
          DATABASE_URL: sqlite+aiosqlite:///./ci.db
        run: |
          uv run alembic upgrade head
          uv run alembic check

  docker:
    runs-on: ubuntu-latest
    needs: [lint, test]
    steps:
      - uses: actions/checkout@v5
      - name: Validate Docker Compose configuration
        run: docker compose config --quiet
      - name: Build Docker images (uv sync --frozen inside)
        run: docker compose build router-api notifier
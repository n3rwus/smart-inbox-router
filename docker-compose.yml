
name: smart-inbox-router

services:
  ollama:
    image: ollama/ollama:0.40.15
    volumes:
      - ollama-models:/root/.ollama
    networks: [llm-net, egress]
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 10s
    restart: unless-stopped
    # No published ports: Ollama has no authentication, so it must not be exposed to the host.

  ollama-init:
    image: ollama/ollama:0.40.15
    environment:
      OLLAMA_HOST: ollama:11434
    entrypoint: ["ollama", "pull", "${LLM__MODEL:-qwen2.5:3b}"]
    depends_on:
      ollama:
        condition: service_healthy
    networks: [llm-net]
    restart: "no"

  mailhog:
    image: mailhog/mailhog:v1.0.1
    platform: linux/amd64
    # No ARM image is available; Apple Silicon runs this image through emulation.
    ports:
      - "127.0.0.1:8025:8025"
    # Only the web UI is published, on loopback, since MailHog has no auth.
    # SMTP 1025 stays internal; services reach it via the mail-net network.
    networks: [mail-net, edge]
    restart: unless-stopped

  notifier:
    build:
      context: .
      args:
        SERVICE: notifier
    image: sir/notifier:dev
    command: ["python", "-m", "notifier"]
    env_file:
      - path: .env
        required: false
    environment:
      NOTIFIER_HTTP__HOST: ${NOTIFIER_HTTP__HOST:-0.0.0.0}
      NOTIFIER_HTTP__PORT: ${NOTIFIER_HTTP__PORT:-8000}
      NOTIFIER_SMTP__HOST: ${NOTIFIER_SMTP__HOST:-mailhog}
      NOTIFIER_SMTP__PORT: ${NOTIFIER_SMTP__PORT:-1025}
      NOTIFIER_SMTP__START_TLS: ${NOTIFIER_SMTP__START_TLS:-false}
    networks: [mail-net, notify-net]
    depends_on: [mailhog]
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - |
          import os, urllib.request, sys
          port = os.environ.get("NOTIFIER_HTTP__PORT", "8000")
          with urllib.request.urlopen(f"http://127.0.0.1:{port}/ready", timeout=2) as r:
              sys.exit(0 if r.status == 200 else 1)
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s
    restart: unless-stopped
    # No published ports: notifier is internal; only the router calls it over notify-net.

volumes:
  ollama-models:

networks:
  edge: {}
  # Network for services exposing ports to the host.
  egress: {}
  # Network providing outbound internet access.
  llm-net:
    internal: true
  # Isolated network for LLM services.
  mail-net:
    internal: true
  # Isolated network for mail services.
  notify-net:
    internal: true
  # Isolated network for router → notifier traffic.

[project]
name = "common"
version = "0.1.0"
description = "Shared infrastructure for Smart Inbox Router services: settings, logging, async DB, HTTP problem+json, SMTP, OpenTelemetry."
readme = "README.md"
license = "MIT"
authors = [
    { name = "n3rwus", email = "mnerwinski@outlook.com" }
]
requires-python = ">=3.12"
dependencies = [
    "aiosmtplib>=5.1.3",
    "aiosqlite>=0.22.1",
    "fastapi>=0.162.2",
    "httpx>=0.28.1",
    "opentelemetry-exporter-otlp-proto-http>=1.45.2",
    "opentelemetry-instrumentation-fastapi>=0.66b2",
    "opentelemetry-instrumentation-httpx>=0.66b2",
    "opentelemetry-sdk>=1.45.2",
    "prometheus-client>=0.26.0",
    "pydantic-settings>=2.16.2",
    "sqlalchemy[asyncio]>=2.1.8",
]

[build-system]
requires = ["uv_build>=0.9.14,<0.10.0"]
build-backend = "uv_build"

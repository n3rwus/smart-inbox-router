[project]
name = "notifier"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "n3rwus", email = "mnerwinski@outlook.com" }
]
requires-python = ">=3.12"
dependencies = [
    "aiosmtplib>=5.1.3",
    "alembic>=1.20.1",
    "common",
    "fastapi>=0.162.2",
    "mcp>=2.3.0",
    "pydantic[email]>=2.14.3",
    "uvicorn[standard]>=0.54.0",
]

[project.scripts]
notifier = "notifier:main"

[build-system]
requires = ["uv_build>=0.9.14,<0.10.0"]
build-backend = "uv_build"

[tool.uv.sources]
common = { workspace = true }
